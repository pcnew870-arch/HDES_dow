<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17251c">
  <!-- <meta name="description" content="حمّل تطبيق زيتون على الكمبيوتر أو هاتف Android من صفحة التنزيل الرسمية."> -->
  <title>  حمّل التطبيق</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f5eb;
      --muted: #b7c0b4;
      --olive: #a9bd65;
      --olive-dark: #758b3e;
      --panel: rgba(255, 255, 255, .075);
      --line: rgba(255, 255, 255, .12);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      min-width: 320px;
      margin: 0;
      background:
        radial-gradient(ellipse at 82% 7%, rgba(116, 139, 62, .25), transparent 35rem),
        radial-gradient(ellipse at 9% 36%, rgba(194, 129, 70, .12), transparent 31rem),
        #17251c;
      color: var(--ink);
      font-family: Tahoma, "Segoe UI", Arial, sans-serif;
      line-height: 1.7;
    }

    a { color: inherit; }

    .shell {
      width: min(1120px, calc(100% - 48px));
      margin-inline: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 88px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-size: 1.25rem;
      font-weight: 800;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 40px;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 14px;
      background: linear-gradient(145deg, #c0d779, #71863c);
      color: #17251c;
      font-size: 1.2rem;
      box-shadow: 0 8px 26px rgba(169, 189, 101, .2);
    }

    .top-link {
      color: var(--muted);
      font-size: .92rem;
      text-decoration: none;
      transition: color .2s ease;
    }

    .top-link:hover { color: var(--ink); }

    .hero {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      align-items: center;
      gap: 54px;
      min-height: 495px;
      padding-block: 62px 56px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 19px;
      color: #d3e49c;
      font-size: .9rem;
      font-weight: 700;
    }

    .eyebrow::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--olive);
      box-shadow: 0 0 15px var(--olive);
      content: "";
    }

    h1 {
      max-width: 600px;
      margin: 0;
      font-size: clamp(2.5rem, 5vw, 4.65rem);
      letter-spacing: -.055em;
      line-height: 1.16;
    }

    h1 span {
      color: var(--olive);
      background: linear-gradient(100deg, #d6e99a, #a9bd65 70%, #e8b87c);
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-copy {
      max-width: 510px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      margin-top: 30px;
    }

    .button {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 21px;
      border: 1px solid transparent;
      border-radius: 15px;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .2);
    }

    .button:focus-visible, .top-link:focus-visible, .brand:focus-visible {
      outline: 3px solid #e6bd77;
      outline-offset: 4px;
    }

    .button-primary {
      background: linear-gradient(110deg, #c4d97e, #95aa50);
      color: #19251a;
    }

    .button-secondary {
      border-color: var(--line);
      background: rgba(255, 255, 255, .04);
      color: var(--ink);
    }

    .button-icon {
      width: 21px;
      height: 21px;
      flex: 0 0 auto;
    }

    .hero-note {
      margin: 16px 0 0;
      color: #93a092;
      font-size: .82rem;
    }

    .visual {
      position: relative;
      display: grid;
      min-height: 350px;
      place-items: center;
      isolation: isolate;
    }

    .visual::before, .visual::after {
      position: absolute;
      z-index: -1;
      border-radius: 50%;
      content: "";
      filter: blur(1px);
    }

    .visual::before {
      width: 290px;
      height: 290px;
      background: linear-gradient(145deg, rgba(200, 220, 130, .25), rgba(98, 120, 55, .08));
      box-shadow: 0 0 90px rgba(169, 189, 101, .1);
    }

    .visual::after {
      width: 210px;
      height: 210px;
      border: 1px solid rgba(226, 200, 140, .22);
      transform: translate(92px, 47px);
    }

  .app-tile {
  display: grid;
  width: 172px;
  aspect-ratio: 1;
  place-items: center;
  padding: 12px;
  border: 1px solid rgba(255, 255, 255, .42);
  border-radius: 46px;
  background: linear-gradient(145deg, #e1e9b0 0%, #a9bd65 48%, #73883f 100%);
  box-shadow: 0 32px 85px rgba(0, 0, 0, .36), inset 0 1px rgba(255, 255, 255, .65);
  color: #233020;
  font-size: 2.9rem;        /* كان 5.2rem */
  font-weight: 900;
  line-height: 1.05;        /* كان موروث 1.7 */
  text-align: center;
  transform: rotate(-8deg);
}

    .floating-tag {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(28, 43, 32, .8);
      box-shadow: 0 14px 36px rgba(0, 0, 0, .18);
      color: #e7ebdc;
      font-size: .82rem;
      backdrop-filter: blur(12px);
    }

    .floating-tag svg { width: 19px; height: 19px; color: #c4d97e; }
    .tag-one { top: 54px; right: 2%; }
    .tag-two { bottom: 52px; left: 3%; }

    .downloads {
      padding-block: 38px 86px;
      scroll-margin-top: 24px;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: clamp(1.7rem, 3vw, 2.25rem);
      letter-spacing: -.035em;
    }

    .section-heading p {
      margin: 5px 0 0;
      color: var(--muted);
    }

    .release {
      flex: 0 0 auto;
      padding: 7px 12px;
      border: 1px solid rgba(169, 189, 101, .28);
      border-radius: 999px;
      background: rgba(169, 189, 101, .09);
      color: #d3e49c;
      font-size: .78rem;
    }

    .download-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .download-card {
      position: relative;
      overflow: hidden;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 23px;
      background: linear-gradient(145deg, rgba(255, 255, 255, .085), rgba(255, 255, 255, .025));
      box-shadow: 0 18px 55px rgba(0, 0, 0, .12);
      transition: border-color .2s ease, transform .2s ease;
    }

    .download-card:hover {
      transform: translateY(-3px);
      border-color: rgba(196, 217, 126, .42);
    }

    .download-card::after {
      position: absolute;
      top: -60px;
      left: -55px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(169, 189, 101, .08);
      content: "";
      pointer-events: none;
    }

    .platform-icon {
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 16px;
      background: rgba(196, 217, 126, .1);
      color: #c8dc82;
    }

    .platform-icon svg { width: 26px; height: 26px; }

    .card-heading {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .card-heading h3 {
      margin: 0;
      font-size: 1.18rem;
    }

    .card-heading p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: .88rem;
    }

    .card-description {
      min-height: 52px;
      margin: 22px 0;
      color: #b8c2b5;
      font-size: .92rem;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .file-type {
      color: #9eaa9b;
      direction: ltr;
      font-size: .78rem;
    }

    .card-button {
      min-height: 44px;
      padding-inline: 16px;
      border-radius: 12px;
      font-size: .88rem;
    }

    .help-strip {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 20px;
      padding: 15px 18px;
      border: 1px solid rgba(226, 200, 140, .17);
      border-radius: 15px;
      background: rgba(193, 139, 78, .06);
      color: #c3c6b8;
      font-size: .84rem;
    }

    .help-strip svg {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      color: #e5bf7d;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding-block: 23px 30px;
      border-top: 1px solid var(--line);
      color: #929e91;
      font-size: .82rem;
    }

    footer a { color: #c6d68d; text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 760px) {
      .hero {
        grid-template-columns: 1fr;
        gap: 10px;
        padding-top: 54px;
      }

      .visual { min-height: 280px; }
      .visual::before { width: 235px; height: 235px; }
      .visual::after { width: 170px; height: 170px; }
      .app-tile { width: 150px; border-radius: 40px; font-size: 3rem; }
      .tag-one { top: 30px; right: 8%; }
      .tag-two { bottom: 28px; left: 8%; }
    }

    @media (max-width: 560px) {
      .shell { width: min(100% - 32px, 420px); }
      .topbar { min-height: 72px; }
      .top-link { font-size: .82rem; }
      .hero { min-height: auto; padding-block: 48px 28px; }
      .hero-copy { font-size: 1rem; }
      .hero-actions { display: grid; }
      .hero-actions .button { width: 100%; }
      .visual { min-height: 260px; }
      .downloads { padding-block: 34px 60px; }
      .section-heading { align-items: start; flex-direction: column; }
      .download-grid { grid-template-columns: 1fr; }
      .download-card { padding: 22px; }
      footer { flex-direction: column; gap: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="shell topbar">
    <a class="brand" href="#" aria-label=" الصفحة الرئيسية">
      <span class="brand-mark" aria-hidden="true"> ≡</span>
      <span>حديث</span>
    </a>
    <a class="top-link" href="#downloads">روابط التنزيل <span aria-hidden="true">↓</span></a>
  </header>

  <main>
    <section class="shell hero" aria-labelledby="hero-title">
      <div>
        <!-- <p class="eyebrow">تطبيقك المفضل، أينما كنت</p> -->
        <h1 id="hero-title">تعلم الأحديث <br>مع <span>حديث.</span></h1>
        <!-- <p class="hero-copy">ابدأ تجربتك على الكمبيوتر أو هاتف Android. اختر نسختك وحمّلها مباشرة من روابط الملفات المحلية.</p> -->
        <div class="hero-actions">
          <a class="button button-primary" href="#downloads">
            <svg class="button-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            اختر نسخة التنزيل
          </a>
          <!-- <a class="button button-secondary" href="#downloads">استكشف النسخ <span aria-hidden="true">←</span></a> -->
        </div>
        <!-- <p class="hero-note">ملفات التثبيت تُحمّل من مجلد التنزيلات المحلي في الموقع.</p> -->
      </div>

      <div class="visual" aria-hidden="true">
        <div class="app-tile">حديث</div>
        <div class="floating-tag tag-one">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 7.8 7.5 9.5 4.3-1.7 7.5-4.9 7.5-9.5V6L12 3Z" stroke="currentColor" stroke-width="1.7"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          تعلم بطريقة جديدة
        </div>
        <div class="floating-tag tag-two">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          يعمل بدون اتصال بالإنترنت
        </div>
      </div>
    </section>

    <section class="shell downloads" id="downloads" aria-labelledby="downloads-title">
      <div class="section-heading">
        <div>
          <h2 id="downloads-title">اختر جهازك</h2>
          <!-- <p>حمّل النسخة المناسبة وابدأ خلال لحظات.</p> -->
        </div>
        <span class="release">الإصدار الأحدث</span>
      </div>

      <div class="download-grid">
        <article class="download-card">
          <!-- <div class="card-heading">
            <span class="platform-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="13" rx="1.8" stroke="currentColor" stroke-width="1.7"/><path d="M8 21h8m-4-4v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            </span>
            <div>
              <h3>للكمبيوتر</h3>
              <p>نسخة Windows</p>
            </div>
          </div> -->
          <!-- <p class="card-description">نزّل زيتون على جهازك واستمتع بتجربة مريحة على شاشة أكبر.</p> -->
          <!-- <div class="card-footer">
            <span class="file-type">Windows · .exe</span>
            <a class="button button-primary card-button" href="downloads/zaytoon-setup.exe" download>
              <svg class="button-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              تنزيل للكمبيوتر
            </a>
          </div>
        </article> -->

        <article class="download-card">
          <div class="card-heading">
            <span class="platform-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><rect x="6" y="2.5" width="12" height="19" rx="2.4" stroke="currentColor" stroke-width="1.7"/><path d="M10 5h4m-3 13.5h2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            </span>
            <div>
              <h3>للهاتف</h3>
              <p>نسخة Android</p>
            </div>
          </div>
          <!-- <p class="card-description">خذ زيتون معك أينما ذهبت، وثبّت التطبيق على هاتف Android بسهولة.</p> -->
          <div class="card-footer">
            <span class="file-type">Android · .apk</span>
            <a class="button button-primary card-button" href="downloads/zaytoon-android.apk" download>
              <svg class="button-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              تنزيل للأندرويد
            </a>
          </div>
        </article>
      </div>

      <aside class="help-strip">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M9.7 9a2.4 2.4 0 1 1 4.2 1.6c-.9.9-1.9 1.1-1.9 2.6m0 3v.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>بعد تنزيل ملف Android،تحتاج إلى  تثبيته</span>
      </aside>
    </section>
  </main>

  <footer class="shell">
    <!-- <span>© <span id="year">2026</span> زيتون. جميع الحقوق محفوظة.</span> -->
    <!-- <a href="#downloads">العودة إلى روابط التنزيل ↑</a> -->
  </footer>
</body>
</html>
